# Backup diário do banco do Supabase (nuvem) — roda no repositório PRIVADO
# gabryelcetto/ministerio-louvor-ops, como .github/workflows/backup.yml, com backup.sh e
# restore.sh na raiz daquele repositório.
# Esta cópia em ops/backup/ do repositório público é a referência versionada: aqui ela NÃO roda
# (está fora de .github/workflows). O teste automático dela é o workflow "Backup (autoteste)".
#
# O que faz:
#   1. supabase db dump: papéis (roles), estrutura (schema) e dados;
#   2. compacta (tar.gz) e CRIPTOGRAFA com age usando a chave PÚBLICA (secret AGE_PUBLIC_KEY);
#   3. guarda como artefato da execução por 30 dias.
# Só quem tem a chave PRIVADA (fora do GitHub) consegue abrir o backup.
# Também é keep-alive: o dump (e o ping opcional na API) conta como atividade e evita a pausa do
# plano grátis por inatividade.
# Os ARQUIVOS do Storage (áudios) NÃO entram no dump — só as linhas do banco.

name: Backup do banco

on:
  schedule:
    - cron: '17 6 * * *' # 03:17 em Brasília (06:17 UTC), todo dia
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump criptografado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # String de conexão do "Session pooler" (IPv4), com a senha do banco.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      # Chave PÚBLICA do age (age1…).
      AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
      # Opcionais (keep-alive pela API): valores PÚBLICOS do projeto.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Conferir configuração
        run: |
          missing=0
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Falta o secret SUPABASE_DB_URL (ver README)."; missing=1; }
          [ -n "$AGE_PUBLIC_KEY" ] || { echo "::error::Falta o secret AGE_PUBLIC_KEY (ver README)."; missing=1; }
          exit $missing

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0

      - name: Instalar age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age --version

      - name: Dump, compactar e criptografar
        run: |
          file="$(bash ./backup.sh .)"
          ls -la "$file"
          echo "FILE=$(basename "$file")" >> "$GITHUB_ENV"

      - name: Guardar (30 dias)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
          if-no-files-found: error
          compression-level: 0 # já está compactado e criptografado

      - name: Keep-alive pela API (opcional)
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_PUBLISHABLE_KEY != '' }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Auth health: $code"
