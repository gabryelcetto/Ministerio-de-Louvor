<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a4a" />
    <!-- App interno do ministério: não deve aparecer em buscadores. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Escalas, repertório, cifras e agenda do ministério de louvor."
    />
    <title>Ministério de Louvor</title>
    <!-- Aplica o tema escolhido em Configurações antes da primeira pintura (evita piscar). -->
    <script>
      try {
        var tema = localStorage.getItem('tema');
        if (tema === 'light' || tema === 'dark') document.documentElement.dataset.theme = tema;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
