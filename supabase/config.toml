# Configuração do Supabase LOCAL (CLI). O projeto na nuvem é configurado no painel.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "ministerio-de-louvor"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Cadastro público DESATIVADO: usuários entram só por convite / criados pelo painel.
enable_signup = false
enable_anonymous_sign_ins = false
# Regra de senha (igual no app: src/lib/password.ts e na Edge Function). Na nuvem, configure o
# mesmo no painel do Auth (ver README).
minimum_password_length = 10
password_requirements = "letters_digits"

[auth.email]
double_confirm_changes = true
enable_confirmations = false

# Edge Function de cadastro de integrantes: só aceita chamadas com JWT válido (o gateway confere
# a assinatura; a função confere o usuário e a permissão no banco).
[functions.invite-member]
enabled = true
verify_jwt = true
