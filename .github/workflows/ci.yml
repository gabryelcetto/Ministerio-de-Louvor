name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Toda tabela nova precisa de GRANT explícito para authenticated (CLAUDE.md).
      - run: npm run check:grants
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Valores FICTÍCIOS só para o build passar; não é um projeto real.
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

  db:
    name: Banco (migrations + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Versão fixa: "latest" consulta a API do GitHub e falha por limite de requisições.
          version: 3.2.0

      # Reproduz um projeto NOVO da nuvem: sem privilégios padrão de tabela para anon/authenticated
      # em public. Roda antes das migrations, então um GRANT esquecido quebra os testes aqui.
      - name: Simular privilégios da nuvem
        run: cp supabase/ci/simular-nuvem.sql supabase/migrations/00000000000000_simular_nuvem.sql

      # Sobe só o Postgres local (Docker do runner), aplica as migrations e o seed.
      - run: supabase db start

      # Roda supabase/tests/*.test.sql (RLS, triggers, permissões).
      - run: supabase test db

      # A migration de GRANT precisa ser idempotente: no projeto da nuvem a correção foi feita à
      # mão antes do "Deploy banco". Simula uma correção manual mais larga que a nossa (grant all,
      # inclusive para anon), reaplica a migration e confere que o resultado volta ao esperado.
      - name: Migration de GRANT é idempotente
        run: |
          docker exec -i supabase_db_ministerio-de-louvor psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          grant all on all tables in schema public to anon, authenticated;
          grant all on all sequences in schema public to anon, authenticated;
          SQL
          docker exec -i supabase_db_ministerio-de-louvor psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/migrations/20261120200000_explicit_grants.sql
          docker exec -i supabase_db_ministerio-de-louvor psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/migrations/20261120200000_explicit_grants.sql
          supabase test db
